name: Setup test env
description: CI 테스트용 MQTT 및 RabbitMQ 환경변수 설정
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "MQTT_BROKER_URL=tcp://localhost:1883" >> "$GITHUB_ENV"
        echo "MQTT_CLIENT_ID=data-generator-ci" >> "$GITHUB_ENV"
        echo "MQTT_USERNAME=" >> "$GITHUB_ENV"
        echo "MQTT_PASSWORD=" >> "$GITHUB_ENV"
        echo "MQTT_QOS=0" >> "$GITHUB_ENV"
        echo "MQTT_RETAINED=false" >> "$GITHUB_ENV"
        echo "RABBITMQ_HOST=localhost" >> "$GITHUB_ENV"
        echo "RABBITMQ_PORT=5672" >> "$GITHUB_ENV"
        echo "RABBITMQ_USERNAME=guest" >> "$GITHUB_ENV"
        echo "RABBITMQ_PASSWORD=guest" >> "$GITHUB_ENV"
