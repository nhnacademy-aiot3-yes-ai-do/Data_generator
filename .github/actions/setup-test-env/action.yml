name: Setup test env
description: CI 테스트용 DB/JWT 환경변수 설정
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "MQTT_BROKER_URL=localhost" >> "$GITHUB_ENV"
        echo "MQTT_CLIENT_ID=5432" >> "$GITHUB_ENV"
        echo "MQTT_USERNAME=5432" >> "$GITHUB_ENV"
        echo "MQTT_PASSWORD=5432" >> "$GITHUB_ENV"
        echo "MQTT_QOS=5432" >> "$GITHUB_ENV"
        echo "MQTT_RETAINED=5432" >> "$GITHUB_ENV"
        echo "MQTT_RETAINED=5432" >> "$GITHUB_ENV"
        echo "MQTT_RETAINED=5432" >> "$GITHUB_ENV"
        echo "MQTT_RETAINED=5432" >> "$GITHUB_ENV"
        
        
