name: reusable-test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - uses: ./.github/actions/setup-test-env
      - name: Start Mosquitto for tests
        run: |
          mkdir -p /tmp/mosquitto
          cat > /tmp/mosquitto/mosquitto.conf <<'EOF'
          listener 1883
          allow_anonymous true
          EOF
          docker run -d --name mosquitto-ci \
            -p 1883:1883 \
            -v /tmp/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2
          for i in $(seq 1 10); do
            nc -z localhost 1883 && break
            sleep 1
          done
      - name: Test and coverage check
        run: ./mvnw -B clean verify